<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF7F3" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('prefers-dark-theme');
          var dark = stored === null ? window.matchMedia('(prefers-color-scheme: dark)').matches : stored === 'true';
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');

          var lang = localStorage.getItem('language');
          if (lang !== 'fr' && lang !== 'en') {
            lang = navigator.language && navigator.language.toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en';
          }
          document.documentElement.setAttribute('lang', lang);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/assets/icon/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/assets/icon/favicon-32x32.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icon/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icon/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/general-sans-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/general-sans-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
