<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <filter id="warpA" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.007" numOctaves="4" seed="11" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="170" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="warpB" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.006" numOctaves="4" seed="41" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="150" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <pattern id="linesA" width="280" height="280" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <line x1="0" y1="0" x2="0" y2="280" stroke="#8C4A44" stroke-width="2.5" stroke-opacity="0.46" />
      <line x1="130" y1="0" x2="130" y2="280" stroke="#8C4A44" stroke-width="1.1" stroke-opacity="0.24" />
    </pattern>
    <pattern id="linesB" width="340" height="340" patternUnits="userSpaceOnUse" patternTransform="rotate(-31)">
      <line x1="0" y1="0" x2="0" y2="340" stroke="#8C4A44" stroke-width="1.6" stroke-opacity="0.22" />
      <line x1="200" y1="0" x2="200" y2="340" stroke="#8C4A44" stroke-width="1" stroke-opacity="0.14" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#linesA)" filter="url(#warpA)" />
  <rect width="100%" height="100%" fill="url(#linesB)" filter="url(#warpB)" />
</svg>
